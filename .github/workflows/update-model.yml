name: update model

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests numpy

      - uses: actions/cache@v4
        with:
          path: cache_cs
          key: cache-cs-${{ github.run_id }}
          restore-keys: cache-cs-

      - name: Train
        env:
          PANDASCORE_TOKEN:"di0FFBr1_1GjEpPMJNxCkjdM2cHqPMkUQuVLBZUOITRfjsUK8pc"
        run: python cs_trainer.py

      - name: Build
        env:
          MODEL_URL: ${{ secrets.MODEL_URL }}
        run: python build.py

      - name: Publish model.js
        run: |
          git config user.name "model bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f model.js
          git diff --staged --quiet || git commit -m "model $(date -u +%Y-%m-%d)"
          git push
